# ── Core ──────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y

# Delay main() by 2 s so the host has time to enumerate the ESP32-S3's
# native USB-Serial-JTAG console and the terminal-side `tio` can latch
# onto /dev/ttyACM* before the boot banner and sensor-init logs start.
# Without this, the boot sequence prints into the void.
CONFIG_BOOT_DELAY=2000

# Madgwick uses sqrtf(); needs libm.
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y

# ── ToF: VL53L1X head-clearance (in-tree Zephyr driver) ───────────────────────
# The VL53L5CX is brought up via the vendor ULD by our own wrapper. The
# head-pointing VL53L1X uses Zephyr's sensor driver — DT node is deferred so
# we can move the VL53L5CX off 0x29 before XSHUT is released.
CONFIG_SENSOR=y
CONFIG_VL53L1X=y
CONFIG_VL53L1X_XSHUT=y
# Polling is fine at 10 Hz; saves one GPIO + the IRQ thread.
CONFIG_VL53L1X_INTERRUPT_MODE=n

# ── Pipeline geometry ────────────────────────────────────────────────────────
# Default: worn / real-world geometry (sensor at 1.35 m, operating range
# 0.3–3.0 m). Flip to =y for a desktop demo where the pin sits a few cm
# above the bench surface and objects move within a 10–50 cm envelope —
# the obstacle, drop-off, and head-clearance constants all re-scale and
# the stationary-mute detector is defanged so the resting pin doesn't
# silence the wristband.
CONFIG_HAPNAV_BENCH_MODE=y

# Disable the VL53L1X head sensor for the bench demo — the VL53L5CX's
# ±22.3° cone is wide enough to cover the 10–20 cm bench working volume
# on its own, including the "card above the sensor" head-clearance proxy.
# XSHUT is still pulled low at boot so a physically-wired VL53L1X stays
# in reset and can't contend at 0x29. Flip back to =y when the head
# sensor is wanted (worn build).
CONFIG_HAPNAV_HEAD_TOF=n

# Disable the drop-off (cliff) detector for the bench demo. The bench-mode
# geometry assumes the pin is lying flat with the sensor 4 cm above its
# floor; if the pin is actually in worn pose on the desk, most rays look
# across the desk into the room beyond, and the detector fires DROPOFF
# on every frame. With the override stuck on, the wristband can never
# show urgency-driven pulses. Flip back to =y for the worn build.
CONFIG_HAPNAV_DROPOFF=n

# ── BLE (central role: drives the wristband) ─────────────────────────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="HapNav-Pin"
CONFIG_BT_MAX_CONN=1

# Bigger ATT MTU so a 212-byte combined frame fits in a single ATT_WRITE_CMD.
# ACL buffers cover MTU + 4 bytes of L2CAP header.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# ESP32 BLE controller benefits from a generous heap; ToF firmware blob upload
# also wants the bigger main stack.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Drop ANSI colour escapes from the log backend — the Arduino IDE Serial
# Monitor (and most "simple" serial viewers) don't strip them and they
# appear as literal `[0m`, `[1;31m` etc. in the output.
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# Send printk() directly to the console instead of routing it through the
# log subsystem's ring buffer. Our per-sample trace lines are large enough
# that the default behaviour drops other modules' log messages under load
# ("--- N messages dropped ---"). With this off, the trace and LOG_*()
# output are interleaved chronologically without buffer competition.
CONFIG_LOG_PRINTK=n

# Float printing in LOG_*() format strings.
CONFIG_CBPRINTF_FP_SUPPORT=y
