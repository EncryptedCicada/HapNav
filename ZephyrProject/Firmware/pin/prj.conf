# ── Core ──────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y

# Delay main() by 2 s so the host has time to enumerate the ESP32-S3's
# native USB-Serial-JTAG console and the terminal-side `tio` can latch
# onto /dev/ttyACM* before the boot banner and sensor-init logs start.
# Without this, the boot sequence prints into the void.
CONFIG_BOOT_DELAY=2000

# Float printing + libm (BNO055 quaternion scaling, dropoff residual maths).
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y

# ── I²C mux: TCA9548A (8-channel) hangs the three ToFs off i2c0 ───────────────
# Same driver family as the wristband mux. Channels must initialise after
# the root; Zephyr enforces the ordering with the priority below.
CONFIG_I2C_TCA954X=y
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=70

# ── ToFs: VL53L1X (head + down) on muxed branches ─────────────────────────────
# Each VL53L1X sits at its default 0x29 on its own mux channel — no XSHUT
# dance, no deferred init. The VL53L5CX (front, vendor ULD) is brought up
# in code on the front channel's virtual bus.
CONFIG_SENSOR=y
CONFIG_VL53L1X=y
# Polling for both heads; saves a GPIO + IRQ thread per sensor.
CONFIG_VL53L1X_INTERRUPT_MODE=n

# ── Pipeline geometry ────────────────────────────────────────────────────────
# Default: worn / real-world geometry (sensor at 1.35 m, operating range
# 0.3–3.0 m). Flip to =y for a desktop demo where the pin stands upright
# on a desk and objects move within a 10 cm – 2 m envelope — the obstacle,
# drop-off, and head-clearance constants all re-scale and the
# stationary-mute detector is defanged so the resting pin doesn't silence
# the wristband.
CONFIG_HAPNAV_BENCH_MODE=y

# Disable the VL53L1X head sensor for the bench demo — the VL53L5CX's
# ±22.3° cone is wide enough to cover the 10–20 cm bench working volume
# on its own. Flip back to =y when the head sensor is wanted (worn build).
CONFIG_HAPNAV_HEAD_TOF=y

# Disable the down-pointing dropoff detector for the bench demo — the
# down ToF's geometry only makes sense in the worn pose (pin upright on
# a body, sensor ~1.35 m above floor). Flip to =y for worn-mode testing.
CONFIG_HAPNAV_DROPOFF=y
CONFIG_HAPNAV_DOWN_TOF=y

# ── BLE (central role: drives the wristband) ─────────────────────────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="HapNav-Pin"
CONFIG_BT_MAX_CONN=1

# Bigger ATT MTU so a 212-byte combined frame fits in a single ATT_WRITE_CMD.
# ACL buffers cover MTU + 4 bytes of L2CAP header.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# ESP32 BLE controller benefits from a generous heap; ToF firmware blob upload
# also wants the bigger main stack.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=16384

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Drop ANSI colour escapes from the log backend — the Arduino IDE Serial
# Monitor (and most "simple" serial viewers) don't strip them and they
# appear as literal `[0m`, `[1;31m` etc. in the output.
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# Send printk() directly to the console instead of routing it through the
# log subsystem's ring buffer. Our per-sample trace lines are large enough
# that the default behaviour drops other modules' log messages under load
# ("--- N messages dropped ---"). With this off, the trace and LOG_*()
# output are interleaved chronologically without buffer competition.
CONFIG_LOG_PRINTK=n

# Float printing in LOG_*() format strings.
CONFIG_CBPRINTF_FP_SUPPORT=y
