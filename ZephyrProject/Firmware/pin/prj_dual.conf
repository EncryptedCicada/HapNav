# Dual-link overlay: layer on top of prj.conf with
#   west build -p always -b xiao_esp32s3/esp32s3/procpu . -- -DEXTRA_CONF_FILE=prj_dual.conf
# (combinable: -DEXTRA_CONF_FILE="prj_dual.conf;prj_demo.conf")
#
# The pin drives the wristband (BLE central, src/ble.c) AND streams the same
# frames to a laptop (BLE peripheral advertising HapNav-Pin, src/ble_laptop.c)
# at the same time. The links are independent: either can drop and reconnect
# without affecting the other. Receiver: Tools/ble_receiver.py.
CONFIG_HAPNAV_LINK_WRIST=y
CONFIG_HAPNAV_LINK_LAPTOP=y

CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_PERIPHERAL=y

# One wristband + one laptop. The ESP32 controller's activity budget
# (CONFIG_ESP32_BT_CTLR_LE_MAX_ACT, default 6) covers 2 conns + scan + adv.
CONFIG_BT_MAX_CONN=2
