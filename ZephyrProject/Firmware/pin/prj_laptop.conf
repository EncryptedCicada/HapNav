# Laptop-only overlay (use prj_dual.conf for laptop + wristband together): layer on top of prj.conf with
#   west build -p always -b xiao_esp32s3/esp32s3/procpu . -- -DEXTRA_CONF_FILE=prj_laptop.conf
#
# The pin stops acting as a BLE central (no wristband scan) and instead
# advertises as a peripheral that a laptop connects to. Frames go out as
# GATT notifications; see src/ble_laptop.c and Tools/ble_receiver.py.
CONFIG_HAPNAV_LINK_WRIST=n
CONFIG_HAPNAV_LINK_LAPTOP=y

CONFIG_BT_CENTRAL=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_PERIPHERAL=y
